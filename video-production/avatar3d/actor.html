import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';import{FBXLoader}from'three/addons/loaders/FBXLoader.js';

const events={};
const host=document.getElementById('stage'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setSize(700,992);renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.96;host.append(renderer.domElement);
const world=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,700/992,.01,100);camera.position.set(0,1.18,3.1);camera.lookAt(0,1.18,0);const pmrem=new THREE.PMREMGenerator(renderer);world.environment=pmrem.fromScene(new RoomEnvironment(),.06).texture;
world.add(new THREE.HemisphereLight(0xdceeff,0x66503e,1.3));const key=new THREE.DirectionalLight(0xffebcf,2.3);key.position.set(2,4,4);world.add(key);const fill=new THREE.DirectionalLight(0xc3dcff,1.05);fill.position.set(-3,2,3);world.add(fill);const rim=new THREE.DirectionalLight(0xffd695,1.25);rim.position.set(-1,3,-2);world.add(rim);
const base='/avatar3d-output/runtime/';const modelInfo=await(await fetch(base+'model-report.json')).json();let gltf;
if(modelInfo.sourceFormat==='FBX'){
 const manager=new THREE.LoadingManager();manager.setURLModifier(url=>{if(/\.tga(?:\?.*)?$/i.test(url)){const name=url.replaceAll('\\','/').split('/').at(-1).replace(/\.tga(?:\?.*)?$/i,'.png');return base+name;}return url;});
 const loader=new FBXLoader(manager);const object=await loader.loadAsync(base+'professor.fbx');
 const remove=[];object.traverse(o=>{if(o.isMesh&&/(?:midpoly|ultralowpoly|(?<!hi)lowpoly)/i.test(o.name))remove.push(o);});remove.forEach(o=>o.removeFromParent());
 const targetNodes=new Map();object.traverse(o=>targetNodes.set(o.name.toLowerCase().replace(/[^a-z0-9]/g,''),o));const clips=[];
 for(const kind of ['talk','explain']){const motion=await loader.loadAsync(base+kind+'.fbx');for(const clip of motion.animations){const tracks=[];for(const track of clip.tracks){const split=track.name.lastIndexOf('.'),name=track.name.slice(0,split),property=track.name.slice(split+1);if(property!=='quaternion')continue;let target=targetNodes.get(name.toLowerCase().replace(/[^a-z0-9]/g,''));if(!target){const key=name.toLowerCase().replace(/[^a-z0-9]/g,'').replace(/^.*bip0*\d*/,'bip');target=[...targetNodes.values()].find(o=>o.name.toLowerCase().replace(/[^a-z0-9]/g,'').replace(/^.*bip0*\d*/,'bip')===key);}if(target){const t=track.clone();t.name=target.name+'.'+property;tracks.push(t);}}if(tracks.length>15)clips.push(new THREE.AnimationClip('lecture_'+kind,clip.duration,tracks));}}
 object.traverse(o=>{if(o.isMesh){const materials=Array.isArray(o.material)?o.material:[o.material];const updated=materials.map(old=>{const label=old.name.toLowerCase(),part=/opacity|hair|eyelash/.test(label)?'opacity':/head|eye|teeth|tongue/.test(label)?'head':'body',textures=new THREE.TextureLoader();const map=textures.load(base+'m020_'+part+'_color.png');map.colorSpace=THREE.SRGBColorSpace;const material=new THREE.MeshStandardMaterial({name:old.name,color:0xffffff,map,roughness:part==='body'?.8:.62,metalness:0,transparent:part==='opacity',alphaTest:part==='opacity'?.35:0,side:THREE.DoubleSide});if(part!=='opacity'){material.normalMap=textures.load(base+'m020_'+part+'_normal.png');material.normalScale=new THREE.Vector2(.25,.25);}return material;});o.material=Array.isArray(o.material)?updated:updated[0];}});
 await new Promise(resolve=>{const timer=setInterval(()=>{if(!manager.isLoading){clearInterval(timer);setTimeout(resolve,800);}},100);setTimeout(()=>{clearInterval(timer);resolve();},5000);});gltf={scene:object,animations:clips};
}else gltf=await new GLTFLoader().loadAsync(base+'professor.glb');const actor=gltf.scene;world.add(actor);actor.updateMatrixWorld(true);let bounds=new THREE.Box3().setFromObject(actor),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());const scale=1.78/size.y;actor.scale.multiplyScalar(scale);actor.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);actor.updateMatrixWorld(true);
let originalMorphTargets=0;actor.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary){const entries=Object.entries(o.morphTargetDictionary),count=entries.length;originalMorphTargets+=count;const keep=entries.filter(([name])=>/AA_VI_\d+_(?:PP|SS|E|aa|O|U|FF|nn)$|AK_\d+_(?:EyeBlinkLeft|EyeBlinkRight|EyeSquintLeft|EyeSquintRight|MouthSmileLeft|MouthSmileRight|JawOpen)$/i.test(name)).sort((a,b)=>a[1]-b[1]);if(keep.length>=10){for(const kind of Object.keys(o.geometry.morphAttributes)){const attrs=o.geometry.morphAttributes[kind];if(attrs.length===count)o.geometry.morphAttributes[kind]=keep.map(([,i])=>attrs[i]);}o.morphTargetDictionary=Object.fromEntries(keep.map(([name],i)=>[name,i]));o.morphTargetInfluences=keep.map(()=>0);}}});
const bones=[],morphs=[],meshes=[];actor.traverse(o=>{if(o.isBone)bones.push(o);if(o.isMesh){meshes.push(o);o.frustumCulled=false;if(o.material){for(const mat of(Array.isArray(o.material)?o.material:[o.material])){mat.side=THREE.DoubleSide;mat.metalness=0;mat.envMapIntensity=.75;}}if(o.morphTargetDictionary&&o.morphTargetInfluences)morphs.push(o);}});
const basic=bones.map(b=>({bone:b,q:b.quaternion.clone(),position:b.position.clone()}));const normBone=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');const findBone=re=>bones.find(b=>re.test(normBone(b.name)));const head=findBone(/head$/),neck=findBone(/neck$/);const headBase=head?.quaternion.clone();
const mixer=new THREE.AnimationMixer(actor);let talk=null,explain=null;for(const clip of gltf.animations){const action=mixer.clipAction(clip);action.setLoop(THREE.LoopPingPong,Infinity).play();if(clip.name.includes('explain'))explain=action;else if(clip.name.includes('talk'))talk=action;else action.enabled=false;}
const morphNames=[...new Set(morphs.flatMap(m=>Object.keys(m.morphTargetDictionary)))];const normalizedMorph=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function matches(names){return morphNames.filter(n=>names.some(q=>normalizedMorph(n).endsWith(q)||normalizedMorph(n)===q));}
const visemeCode=code=>morphNames.filter(n=>new RegExp('AA_VI_\\d+_'+code+'$','i').test(n));const visemes={A:visemeCode('PP'),B:visemeCode('SS'),C:visemeCode('E'),D:visemeCode('aa'),E:visemeCode('O'),F:visemeCode('U'),G:visemeCode('FF'),H:visemeCode('nn'),X:[]};
const blinkL=matches(['eyeblinkleft','blinkleft','blinkl']),blinkR=matches(['eyeblinkright','blinkright','blinkr']);const jaw=matches(['jawopen','mouthopen']);let mouthIndex=0;
function morphSet(names,value){for(const mesh of morphs)for(const name of names){const i=mesh.morphTargetDictionary[name];if(i!==undefined)mesh.morphTargetInfluences[i]=Math.max(mesh.morphTargetInfluences[i],value);}}
function aimBone(bone,child,target){if(!bone||!child)return;actor.updateMatrixWorld(true);const p=bone.getWorldPosition(new THREE.Vector3()),c=child.getWorldPosition(new THREE.Vector3()),a=c.sub(p).normalize(),b=target.clone().sub(p).normalize();const delta=new THREE.Quaternion().setFromUnitVectors(a,b),wq=bone.getWorldQuaternion(new THREE.Quaternion()),pq=bone.parent.getWorldQuaternion(new THREE.Quaternion());bone.quaternion.copy(pq.invert().multiply(delta.multiply(wq)));actor.updateMatrixWorld(true);}
function manualArms(t,gesture){for(const side of ['l','r']){const upper=findBone(new RegExp(side+'upperarm$')),fore=findBone(new RegExp(side+'forearm$')),hand=findBone(new RegExp(side+'hand$'));if(!upper||!fore||!hand)continue;const p=upper.getWorldPosition(new THREE.Vector3()),sign=p.x>=0?1:-1,active=sign>0?gesture:0;const elbow=p.clone().add(new THREE.Vector3(sign*(.12+.06*active),-.29+.07*active,.025+.04*active));aimBone(upper,fore,elbow);const e=fore.getWorldPosition(new THREE.Vector3());aimBone(fore,hand,e.clone().add(new THREE.Vector3(sign*(.015+.18*active),-.12+.25*active,.15)));}}
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};const pulse=(t,start,duration=4)=>smooth((t-start)/.7)*(1-smooth((t-start-duration)/.7));

window.setFrame=t=>{
 const segment=performanceData.appearances.find(s=>t>=s.offset&&t<s.offset+s.seconds)||performanceData.appearances.at(-1);
 const local=t-segment.offset;
 const gesture=Math.min(1,pulse(local,2,2.8)+pulse(local,8,3)+pulse(local,14,2));
 if(head&&headBase)head.quaternion.copy(headBase);

 actor.updateMatrixWorld(true);
 if(head){const q=head.quaternion.clone();head.quaternion.copy(q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(.018*Math.sin(t*1.8),-.12*gesture+.018*Math.sin(t*.6),.013*Math.sin(t*.9)))));}
 for(const m of morphs)m.morphTargetInfluences.fill(0);
 while(mouthIndex<mouth.mouthCues.length-1&&mouth.mouthCues[mouthIndex].end<=t)mouthIndex++;

 const cue=mouth.mouthCues[mouthIndex];if(cue&&t>=cue.start&&t<cue.end){const value=Math.min(smooth((t-cue.start)/.045),smooth((cue.end-t)/.045))*.8;morphSet(visemes[cue.value]||[],value);}
 const cycle=t%4.9,blink=cycle>4.48&&cycle<4.7?Math.sin((cycle-4.48)/.22*Math.PI):0;
 morphSet(blinkL,blink);morphSet(blinkR,blink);morphSet(matches(['eyesquintleft','eyesquintright']),.05);morphSet(matches(['mouthsmileleft','mouthsmileright']),.025);
 camera.position.z=3.1-.10*(1-smooth(local/12));renderer.render(world,camera);
 return {time:t,triangles:renderer.info.render.triangles,gesture,mouth:cue?.value,morphPeak:Math.max(0,...morphs.flatMap(m=>m.morphTargetInfluences)),head:head?head.quaternion.toArray():null};
};

name: Review generated Arabic legal terminology
on:
  push:
    branches: [voice-portrait-trial-20261019]
    paths: ['quality-trial-20261019/asr.py', '.github/workflows/quality-asr-20261019.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRIAL_MODE: asr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Recover the actual comparison recordings
        run: |
          mkdir -p quality-output/asr
          git fetch origin quality-audio-20261019 quality-neural-tts-20261019
          for label in A B C D; do git show "origin/quality-audio-20261019:preview/$label.mp3" > "quality-output/asr/$label.mp3"; done
          git show origin/quality-neural-tts-20261019:preview/raw.wav > quality-output/asr/neural.wav
      - name: Verify recovered Arabic terms independently
        run: |
          exec > >(tee trial.log) 2>&1
          pip install requests numpy==1.26.4 faster-whisper==1.1.1 huggingface-hub==0.36.0 tokenizers==0.22.1
          python quality-trial-20261019/asr.py
      - name: Retain transcripts and word timings
        if: always()
        run: python quality-trial-20261019/retain.py

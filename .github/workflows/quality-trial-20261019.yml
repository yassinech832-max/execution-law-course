name: Arabic narration and portrait quality trial
on:
  push:
    branches: [voice-portrait-trial-20261019]
    paths: ['quality-trial-20261019/trial.py', '.github/workflows/quality-trial-20261019.yml']
permissions:
  contents: write
  statuses: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Produce and compare Arabic legal pronunciation
        run: |
          exec > >(tee trial.log) 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install numpy edge-tts faster-whisper==1.1.1
          python quality-trial-20261019/trial.py audio
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: legal-trial-audio
          path: quality-output/audio/
      - name: Retain audio and diagnostics
        if: always()
        env:
          TRIAL_MODE: audio
        run: |
          python quality-trial-20261019/retain.py
  portrait:
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [wav2lip, sadtalker]
    env:
      TRIAL_MODE: ${{ matrix.engine }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: legal-trial-audio
          path: quality-output/audio/
      - name: Prepare compatible free CPU animation
        run: |
          exec > >(tee trial.log) 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
          pip install setuptools==69.5.1 wheel
          pip install torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.23.5 scipy==1.10.1 librosa==0.9.2 numba==0.57.1 pillow==9.5.0 opencv-python-headless==4.8.1.78 tqdm
          mkdir -p engines
          if [ "$TRIAL_MODE" = wav2lip ]; then
            git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git engines/Wav2Lip
          else
            git clone --depth 1 https://github.com/OpenTalker/SadTalker.git engines/SadTalker
            pip install --no-build-isolation face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 resampy==0.3.1 pydub==0.25.1 kornia==0.6.8 yacs pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors
          fi
      - name: Generate real audio-driven portrait movement
        run: |
          python quality-trial-20261019/trial.py "$TRIAL_MODE" >> trial.log 2>&1
      - name: Retain preview and measured report
        if: always()
        run: python quality-trial-20261019/retain.py

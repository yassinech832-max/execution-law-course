name: Produce measured course video files
on:
  push:
    branches: [main]
    paths: ['video-production/queue.json']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: course-video-production
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy edge-tts faster-whisper
      - name: Render requested lectures sequentially
        run: |
          python video-production/run_queue.py
      - name: Retain finished files and production reports
        if: always()
        run: |
          mkdir -p /tmp/course-render-output
          cp video-production/queue.json /tmp/course-render-output/queue.json
          python - <<'PY'
          from pathlib import Path
          import shutil
          for unit in Path('rendered').glob('unit-*'):
              dest=Path('/tmp/course-render-output')/unit.name
              dest.mkdir(parents=True,exist_ok=True)
              for file in unit.iterdir():
                  if file.is_file() and file.suffix in ['.mp4','.vtt','.srt','.jpg','.txt','.json']:
                      shutil.copy2(file,dest/file.name)
          PY
          git fetch origin video-production-output || true
          if git show-ref --verify --quiet refs/remotes/origin/video-production-output; then
            git checkout -B video-production-output origin/video-production-output
          else
            git checkout --orphan video-production-output
            git rm -rf --cached .
          fi
          mkdir -p media
          cp -r /tmp/course-render-output/unit-* media/ 2>/dev/null || true
          git add media
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Retain rendered course lectures and duration checks'
            git push origin HEAD:video-production-output
          fi
      - name: Record file measurements
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const queue=JSON.parse(fs.readFileSync('/tmp/course-render-output/queue.json','utf8'));
            for (const unit of queue.units) {
              const file=`/tmp/course-render-output/unit-${String(unit).padStart(2,'0')}/report.json`;
              const r=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):{status:'FAIL',error:'No complete rendering report was produced'};
              const ok=r.status==='PASS';
              const description=ok?`${r.durationSeconds.toFixed(3)}s; ${r.resolution.join('x')}; ${r.captionCues} captions; decode PASS`:(r.error||'Render failed').replace(/\s+/g,' ').slice(0,140);
              await github.rest.repos.createCommitStatus({...context.repo,sha:context.sha,state:ok?'success':'failure',context:`course/video-${unit}`,description});
            }

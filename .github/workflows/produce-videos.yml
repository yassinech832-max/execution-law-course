name: Produce measured course video files
on:
  push:
    branches: [main]
    paths: ['video-production/queue.json']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
concurrency:
  group: course-video-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.queue.outputs.units }}
    steps:
      - uses: actions/checkout@v4
      - id: queue
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          queue=json.loads(Path('video-production/queue.json').read_text())
          assert queue['units'] and len(set(queue['units'])) == len(queue['units'])
          assert all(isinstance(n,int) and 1<=n<=7 for n in queue['units'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('units='+json.dumps(queue['units'])+'\n')
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      VIDEO_UNIT: ${{ matrix.unit }}
      OUTPUT_BRANCH: video-production-unit-${{ matrix.unit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy edge-tts faster-whisper
      - name: Render and inspect the lecture
        run: python video-production/run_queue.py "$VIDEO_UNIT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain finished files and production reports
        if: always()
        run: |
          mkdir -p /tmp/course-render-output
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          Path('/tmp/course-render-output/queue.json').write_text(json.dumps({'units':[int(os.environ['VIDEO_UNIT'])]}))
          for unit in Path('rendered').glob('unit-*'):
              dest=Path('/tmp/course-render-output')/unit.name
              dest.mkdir(parents=True,exist_ok=True)
              for file in unit.iterdir():
                  if file.is_file() and file.suffix in ['.mp4','.vtt','.srt','.jpg','.txt','.json']:
                      shutil.copy2(file,dest/file.name)
              for file in (unit/'work').glob('speech-*'):
                  if file.suffix in ['.mp3','.json']:
                      (dest/'voice-cache').mkdir(exist_ok=True)
                      shutil.copy2(file,dest/'voice-cache'/file.name)
          PY
          git fetch origin "$OUTPUT_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$OUTPUT_BRANCH"; then
            git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH"
          else
            git checkout --orphan "$OUTPUT_BRANCH"
            git rm -rf --cached .
          fi
          mkdir -p media
          cp -r /tmp/course-render-output/unit-* media/ 2>/dev/null || true
          git add media
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Retain rendered lecture and duration checks'
            git push origin "HEAD:$OUTPUT_BRANCH"
          fi
      - name: Record file measurements
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const queue=JSON.parse(fs.readFileSync('/tmp/course-render-output/queue.json','utf8'));
            for (const unit of queue.units) {
              const file=`/tmp/course-render-output/unit-${String(unit).padStart(2,'0')}/report.json`;
              const r=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,'utf8')):{status:'FAIL',error:'No complete rendering report was produced'};
              const ok=r.status==='PASS';
              const description=ok?`${r.durationSeconds.toFixed(3)}s; ${r.resolution.join('x')}; ${r.captionCues} captions; decode PASS`:(r.error||'Render failed').replace(/\s+/g,' ').slice(0,140);
              await github.rest.repos.createCommitStatus({...context.repo,sha:context.sha,state:ok?'success':'failure',context:`course/video-${unit}`,description});
            }

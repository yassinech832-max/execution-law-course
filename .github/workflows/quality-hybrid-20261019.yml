name: Short hybrid portrait quality comparison
on:
  push:
    branches: [voice-portrait-trial-20261019]
    paths: ['quality-trial-20261019/hybrid.py', '.github/workflows/quality-hybrid-20261019.yml']
permissions:
  contents: write
  statuses: write
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TRIAL_MODE: hybrid
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Stop the superseded slow comparison
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/39309632937/cancel'
          req=urllib.request.Request(url,data=b'',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
          try:
            with urllib.request.urlopen(req,timeout=20) as response: print('Superseded run cancellation:',response.status)
          except urllib.error.HTTPError as exc:
            if exc.code not in (409,422): raise
          PY
      - name: Load the selected narration
        run: |
          mkdir -p quality-output/audio
          git fetch origin quality-audio-20261019
          git show origin/quality-audio-20261019:preview/intro.wav > quality-output/audio/intro.wav
      - name: Prepare free CPU rendering
        run: |
          exec > >(tee trial.log) 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
          pip install setuptools==69.5.1 wheel
          pip install torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.23.5 scipy==1.10.1 librosa==0.9.2 numba==0.57.1 pillow==9.5.0 opencv-python-headless==4.8.1.78 tqdm
          mkdir -p engines
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git engines/SadTalker
          git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git engines/Wav2Lip
          pip install --no-build-isolation face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 resampy==0.3.1 pydub==0.25.1 kornia==0.6.8 yacs pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors
      - name: Render the hybrid portrait trial
        run: timeout 11m python quality-trial-20261019/hybrid.py >> trial.log 2>&1
      - name: Retain the actual output and diagnostics
        if: always()
        run: python quality-trial-20261019/retain.py

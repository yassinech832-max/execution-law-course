name: Prepare UAEU campus image
on:
  push:
    branches: [prepare-university-image]
    paths: ['.github/workflows/prepare-university-image.yml']
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install image verification dependency
        run: python3 -m pip install --quiet Pillow
      - name: Fetch the university campus photograph from Emirates News Agency
        run: |
          python3 - <<'PY' > image-prepare.log 2>&1
          from pathlib import Path
          import urllib.request,json,hashlib
          from PIL import Image
          url='https://assets.wam.ae/resource/fxq07pzo1k70cvxpd.jpg'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=45) as response:
              assert response.status==200
              data=response.read(8_000_001)
          print('Payload:',len(data),data[:100],flush=True)
          assert len(data)<8_000_000
          dest=Path('assets/university');dest.mkdir(parents=True,exist_ok=True)
          image=dest/'uaeu-campus.jpg';image.write_bytes(data)
          with Image.open(image) as photo:
              photo.verify()
          with Image.open(image) as photo:
              width,height=photo.size
              print('Image format:',photo.format,width,height,flush=True)
              assert width>=400 and height>=200
              if photo.format!='JPEG':photo.convert('RGB').save(image,quality=95)
          (dest/'source.json').write_text(json.dumps({'source':url,'publisher':'Emirates News Agency (WAM)','description':'United Arab Emirates University campus','width':width,'height':height,'sha256':hashlib.sha256(data).hexdigest()},indent=2)+'\n')
          print(json.dumps({'width':width,'height':height,'bytes':len(data)}))
          PY
      - name: Retain the original image for the course update
        if: always()
        run: |
          if [ -d assets/university ]; then git add assets/university; fi
          git add image-prepare.log
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Retain official UAEU campus photograph'
          git push origin HEAD:prepare-university-image

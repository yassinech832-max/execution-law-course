name: Produce a real portrait and Arabic speech trial
on:
  push:
    branches: [presenter-sample]
    paths: ['presenter-production/**', '.github/workflows/presenter-sample.yml']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the measured Arabic narration
        run: |
          git fetch origin presenter-audio-results
          python - <<'PY'
          import pathlib,subprocess
          ref='origin/presenter-audio-results'; prefix='preview/audio/'
          for name in ['narration.wav','intro.wav','captions.vtt','captions.srt','transcript.txt','audio-report.json']:
              dest=pathlib.Path('presenter-output/audio')/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(subprocess.check_output(['git','show',ref+':'+prefix+name]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: presenter-audio
          path: presenter-output/audio/
  animate:
    needs: audio
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [wav2lip, sadtalker]
    env:
      ENGINE: ${{ matrix.engine }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: presenter-audio
          path: presenter-output/audio/
      - name: Install compatible CPU inference tools
        run: |
          exec > >(tee presenter-setup.log) 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core libgl1 libglib2.0-0
          pip install setuptools==69.5.1 wheel
          cat > /tmp/presenter-constraints.txt <<'EOF'
          numpy==1.23.5
          scipy==1.10.1
          numba==0.57.1
          pillow==9.5.0
          opencv-python==4.8.1.78
          opencv-python-headless==4.8.1.78
          torch==2.0.1
          torchvision==0.15.2
          torchaudio==2.0.2
          EOF
          pip install torch==2.0.1 torchvision==0.15.2 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -c /tmp/presenter-constraints.txt numpy scipy librosa==0.9.2 numba pillow opencv-python-headless tqdm
          mkdir -p engines
          if [ "$ENGINE" = wav2lip ]; then
            git clone --depth 1 https://github.com/Rudrabha/Wav2Lip.git engines/Wav2Lip
          else
            git clone --depth 1 https://github.com/OpenTalker/SadTalker.git engines/SadTalker
            pip install --no-build-isolation -c /tmp/presenter-constraints.txt face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 resampy==0.3.1 pydub==0.25.1 kornia==0.6.8 yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors
          fi
      - name: Generate and inspect the real speaking portrait
        run: python presenter-production/sample.py "$ENGINE"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain reviewable outputs
        if: always()
        run: |
          mkdir -p /tmp/presenter-results
          python - <<'PY'
          import os,shutil,json
          from pathlib import Path
          engine=os.environ['ENGINE'];source=Path('presenter-output')/engine;dest=Path('/tmp/presenter-results')/engine;dest.mkdir(exist_ok=True)
          if source.exists():
              for file in source.iterdir():
                  if file.is_file() and file.suffix in ['.mp4','.vtt','.srt','.jpg','.txt','.json']:shutil.copy2(file,dest/file.name)
          if not (dest/'report.json').exists():
              log=Path('presenter-setup.log')
              (dest/'report.json').write_text(json.dumps({'status':'FAIL','error':'Model setup did not complete','setupLog':log.read_text()[-12000:] if log.exists() else ''}))
          PY
          branch="presenter-results-$ENGINE"
          git fetch origin "$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout --orphan "$branch"
            git rm -rf --cached .
          fi
          mkdir -p preview
          cp -r "/tmp/presenter-results/$ENGINE" preview/
          git add preview
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Retain real portrait trial and measured review report'
            git push origin "HEAD:$branch"
          fi

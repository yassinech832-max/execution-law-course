name: Course content and browser checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Start local preview under the Pages path
        run: |
          mkdir -p /tmp/course-preview/execution-law-course
          cp *.html *.css *.js /tmp/course-preview/execution-law-course/
          if [ -d media ]; then cp -r media /tmp/course-preview/execution-law-course/; fi
          python3 tools/preview_server.py --port 8765 --directory /tmp/course-preview > /tmp/course-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/execution-law-course/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check all source links and responsive pages
        run: npm run test:browser
        env:
          COURSE_TEST_URL: http://127.0.0.1:8765/execution-law-course/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-browser-review
          path: test-results/
          if-no-files-found: ignore
      - name: Record browser result on the commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'test-results/report.json';
            const report = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {status: 'FAIL', stage: 'setup', error: 'No browser report was produced'};
            const passed = report.status === 'PASS';
            const description = passed ? `${report.sourceLinkDestinations} reading links; ${report.renderedSourceParagraphs} paragraphs; mobile and desktop passed` : `${report.stage}: ${report.error}`.replace(/\s+/g, ' ').slice(0, 140);
            await github.rest.repos.createCommitStatus({...context.repo, sha: context.sha, context: 'course/browser', state: passed ? 'success' : 'failure', description, target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
